<!DOCTYPE html>
<html lang="en">
<head> 
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Artist in New Bedford Massachusetts Eric Souza, 3D Printing, Rapid Prototyping, 3D Modeling, CAD, Photographer, Videographer, Custom Fabricator, Robotics, Information Technology, Web Design">
  <meta name="robots" content="index, follow">
  <meta name="googlebot" content="index, follow">
  <meta property="og:title" content="Black Beard Graphics">
  <meta property="og:description" content="Artist in New Bedford Massachusetts Eric Souza, 3D Printing, Rapid Prototyping, 3D Modeling, CAD, Photographer, Videographer, Custom Fabricator, Robotics, Information Technology, Web Design">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.blackbeardgraphics.com/">
  <title>Black Beard Graphics</title>
  <link rel="stylesheet" href="css/stylesheet.css">
  <link rel="stylesheet" href="https://use.typekit.net/xgx6jqb.css">
  <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
  <link rel="icon" href="img/ESD32.ico" sizes="32x32" type="image/x-icon">
  <link rel="icon" href="img/ESD48.ico" sizes="48x48" type="image/x-icon">
  <link rel="icon" href="img/ESD180.ico" sizes="180x180" type="image/x-icon">
  <link rel="icon" href="img/ESD256.ico" sizes="256x256" type="image/x-icon">
  <link rel="preload" href="img/ESD-motion-logo-clean.svg" as="image">
  <link rel="preload" href="img/ESD-spaceship-nav-animated.svg" as="image">
  <link rel="preload" href="img/ESD-splash-screen.svg" as="image">
  <link rel="preload" href="img/Portfolio7.jpg" as="image">
  <link rel="preload" href="img/StormBW.jpg" as="image">
  <link rel="preload" href="img/facebookphotogood.jpg" as="image">
  <link rel="preload" href="main.js" as="script">
  <script defer src="main.js"></script>
  <script
    defer
    src="https://cdn.jsdelivr.net/npm/lazyload@2.0.0-rc.2/lazyload.js">
  </script>
</head>
<body class="index-page">
  <!-- SPLASH SCREEN -->
  <div class="splash-screen" aria-hidden="true">
    <object class="splash-tron-overlay" type="image/svg+xml" 
      data="img/ESD-splash-screen.svg">
    </object>
    <div class="splash-content">
      <!-- <img
        class="splash-logo"
        src="img/ESD-motion-logo-clean.svg"
        alt="ES Design Works Logo"> -->
      <h3 class="animate-text splash-title">
        ES Design Works
      </h3>
      <!-- <p class="splash-tagline">
        DESIGN • DEVELOP • DELIVER
      </p> -->
    </div>
  </div>
  <!-- WALLPAPER -->
  <div class="wallPaper" aria-hidden="true"></div>
  <!-- HEADER -->
  <header class="header">
    <div class="brandCluster">
      <div class="navLogo">
        <a href="index.html" class="nav-logo">
          <img
            src="img/ESD-motion-logo-clean.svg"
            alt="ESD Logo">
        </a>
      </div>
      <div class="designWorksHeader">
        <img
          src="img/designworks-graffiti-chaos.svg"
          alt="Design Works">
      </div>
    </div>
    <div class="beNook navBannerFrame">
      <nav class="navBar" aria-label="Primary navigation">
        <ul class="nav-menu">
          <li class="nav-item">
            <a href="about.html" style="--i:1;">
              About
            </a>
          </li>
          <li class="nav-item">
            <a href="services.html" style="--i:2;">
              Services
            </a>
          </li>
          <li class="nav-item">
            <a href="contact.html" style="--i:3;">
              Contact
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </header>
  <!-- MAIN -->
  <main class="landingContent">
    <section
      class="wheels-section"
      aria-label="Portfolio wheels">
      <div class="wheel-stack">
        <!-- ROW 1 -->
        <div class="wheel-row offset-left">
          <div class="wheel-track" data-speed="0.035" data-direction="left">
            <div class="wheel-card">
              <img src="img/AzulaWide.jpg" alt="Azula Wide" loading="eager" decoding="async" fetchpriority="high">
            </div>
            <div class="wheel-card">
              <img src="img/Roundhill.jpg" alt="Round Hill" loading="eager" decoding="async" fetchpriority="high">
            </div>
            <div class="wheel-card">
              <img src="img/HarpoonBanner3.png" alt="Harpoon Banner 3" loading="eager" decoding="async" fetchpriority="high">
            </div>
            <div class="wheel-card">
              <img src="img/WerewolfRender3.jpg" alt="Werewolf Render 3" loading="eager" decoding="async">
            </div>
            <div class="wheel-card">
              <img src="img/StormBW.jpg" alt="Storm" loading="lazy" decoding="async">
            </div>
            <div class="wheel-card">
              <img src="img/troll4.jpg" alt="Troll 4" loading="lazy" decoding="async">
            </div>
            <div class="wheel-card">
              <img src="img/carConcept5.jpg" alt="Concept Car" loading="lazy" decoding="async">
            </div>
            <div class="wheel-card">
              <img src="img/facebookphotogood.jpg" alt="Facebook Photo" loading="lazy" decoding="async">
            </div>
          </div>
        </div>
        <!-- ROW 2 -->
        <div class="wheel-row offset-right">
          <div class="wheel-track" data-speed="0.06" data-direction="right">
            <div class="wheel-card">
              <img src="img/RetroHarpoon.png" alt="Retro Harpoon" loading="eager" decoding="async">
            </div>
            <div class="wheel-card">
              <img src="img/4kVel.jpg" alt="4K Veluran" loading="eager" decoding="async">
            </div>
            <div class="wheel-card">
              <img src="img/bull.jpg" alt="Bull Design" loading="eager" decoding="async">
            </div>
            <div class="wheel-card">
              <img src="img/jasmine1.jpg" alt="Jasmine 3D Model" loading="lazy" decoding="async">
            </div>
            <div class="wheel-card">
              <img src="img/HorrorHarpoon.png" alt="Horror Harpoon" loading="lazy" decoding="async">
            </div>
            <div class="wheel-card">
              <img src="img/Vern week 7-8.JPG" alt="Vern Week 7-8" loading="lazy" decoding="async">
            </div>
          </div>
        </div>
        <!-- ROW 3 -->
        <div class="wheel-row offset-left">
          <div class="wheel-track" data-speed="0.052" data-direction="left">
            <div class="wheel-card">
              <img src="img/whaleSunrise.jpg" alt="Whale Sunrise" loading="eager" decoding="async">
            </div>
            <div class="wheel-card">
              <img src="img/carConcept2.jpg" alt="Concept Car 2" loading="eager" decoding="async">
            </div>
            <div class="wheel-card">
              <img src="img/driftAway.jpg" alt="Drift Away" loading="eager" decoding="async">
            </div>
            <div class="wheel-card">
              <img src="img/Dragonfly 1.jpg" alt="Dragonfly" loading="eager"decoding="async">
            </div>
            <div class="wheel-card">
              <img src="img/mtmonroe.jpg" alt="Mount Monroe" loading="lazy" decoding="async">
            </div>
            <div class="wheel-card">
              <img src="img/Seagull Crab.jpg" alt="Seagull Crab" loading="lazy" decoding="async">
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
