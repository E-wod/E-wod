<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 2560 1600"
     preserveAspectRatio="xMidYMid slice">

  <defs>

    <radialGradient id="softCenterGlow" cx="50%" cy="50%" r="78%">
      <stop offset="0%" stop-color="#1fdde4" stop-opacity="0.11" />
      <stop offset="52%" stop-color="#621C94" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="flowStrokeA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1fdde4" stop-opacity="0" />
      <stop offset="22%" stop-color="#1fdde4" stop-opacity="0.72" />
      <stop offset="55%" stop-color="#1E85D4" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#1fdde4" stop-opacity="0" />

      <animateTransform
        attributeName="gradientTransform"
        type="translate"
        from="-1 0"
        to="1 0"
        dur="11s"
        repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="flowStrokeB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#621C94" stop-opacity="0" />
      <stop offset="28%" stop-color="#621C94" stop-opacity="0.46" />
      <stop offset="60%" stop-color="#1fdde4" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#621C94" stop-opacity="0" />

      <animateTransform
        attributeName="gradientTransform"
        type="translate"
        from="1 0"
        to="-1 0"
        dur="15s"
        repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="flowStrokeC" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9D00" stop-opacity="0" />
      <stop offset="35%" stop-color="#FF9D00" stop-opacity="0.32" />
      <stop offset="65%" stop-color="#1fdde4" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#FF9D00" stop-opacity="0" />

      <animateTransform
        attributeName="gradientTransform"
        type="translate"
        from="-0.5 0"
        to="1.2 0"
        dur="19s"
        repeatCount="indefinite"/>
    </linearGradient>

    <filter id="softLineGlow">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="particleGlow">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <path id="flowA"
      d="M -260 920 C 260 420, 730 520, 1160 760 S 1960 1180, 2820 620"/>

    <path id="flowB"
      d="M -260 260 C 320 -40, 680 60, 1120 360 S 1940 920, 2820 140"/>

    <path id="flowC"
      d="M -260 1220 C 260 920, 700 1180, 1180 860 S 1900 260, 2820 940"/>

    <path id="flowD"
      d="M 2820 760 C 2200 1220, 1740 1120, 1320 760 S 540 140, -260 620"/>

  </defs>

  <rect width="2560" height="1600" fill="#000"/>
  <rect width="2560" height="1600" fill="url(#softCenterGlow)"/>

  <g opacity="0.018">
    <path
      d="M0 90 H2560 M0 180 H2560 M0 270 H2560 M0 360 H2560
         M0 450 H2560 M0 540 H2560 M0 630 H2560 M0 720 H2560
         M0 810 H2560 M0 900 H2560 M0 990 H2560"
      stroke="#1fdde4"
      stroke-width="1">

      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="0 90"
        dur="18s"
        repeatCount="indefinite"/>
    </path>
  </g>

  <g fill="none" stroke-linecap="round" filter="url(#softLineGlow)">

    <g opacity="0.72">
      <use href="#flowA" stroke="url(#flowStrokeA)" stroke-width="1.5"/>
      <use href="#flowA" stroke="url(#flowStrokeA)" stroke-width="1" transform="translate(0 -140)" opacity="0.62"/>
      <use href="#flowA" stroke="url(#flowStrokeA)" stroke-width="0.85" transform="translate(0 150)" opacity="0.54"/>
      <use href="#flowA" stroke="url(#flowStrokeA)" stroke-width="0.7" transform="translate(0 290)" opacity="0.38"/>
    </g>

    <g opacity="0.62">
      <use href="#flowB" stroke="url(#flowStrokeB)" stroke-width="1.4"/>
      <use href="#flowB" stroke="url(#flowStrokeB)" stroke-width="0.95" transform="translate(0 -190)" opacity="0.58"/>
      <use href="#flowB" stroke="url(#flowStrokeB)" stroke-width="0.8" transform="translate(0 195)" opacity="0.50"/>
      <use href="#flowB" stroke="url(#flowStrokeB)" stroke-width="0.7" transform="translate(0 370)" opacity="0.34"/>
    </g>

    <g opacity="0.56">
      <use href="#flowC" stroke="url(#flowStrokeC)" stroke-width="1.3"/>
      <use href="#flowC" stroke="url(#flowStrokeC)" stroke-width="0.9" transform="translate(0 -240)" opacity="0.54"/>
      <use href="#flowC" stroke="url(#flowStrokeC)" stroke-width="0.75" transform="translate(0 240)" opacity="0.44"/>
      <use href="#flowC" stroke="url(#flowStrokeC)" stroke-width="0.65" transform="translate(0 -430)" opacity="0.30"/>
    </g>

  </g>

  <g opacity="0.78" filter="url(#particleGlow)">

    <circle r="2.2" fill="#1fdde4">
      <animateMotion dur="15s" repeatCount="indefinite"
        path="M -260 920 C 260 420, 730 520, 1160 760 S 1960 1180, 2820 620"/>
    </circle>

    <circle r="1.7" fill="#1E85D4">
      <animateMotion dur="19s" repeatCount="indefinite"
        path="M -260 260 C 320 -40, 680 60, 1120 360 S 1940 920, 2820 140"/>
    </circle>

    <circle r="1.55" fill="#621C94">
      <animateMotion dur="23s" repeatCount="indefinite"
        path="M -260 1220 C 260 920, 700 1180, 1180 860 S 1900 260, 2820 940"/>
    </circle>

    <circle r="1.9" fill="#FF9D00">
      <animateMotion dur="28s" repeatCount="indefinite"
        path="M 2820 760 C 2200 1220, 1740 1120, 1320 760 S 540 140, -260 620"/>
    </circle>

  </g>

</svg>
